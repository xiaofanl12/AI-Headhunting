<!doctype html>
<html lang="zh-CN" data-theme="light">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>登录 · AI 猎头助手</title>
<link rel="preload" href="/assets/fonts/slogan.woff2" as="font" type="font/woff2" crossorigin>
<link rel="stylesheet" href="/assets/auth.css?v=17">
<link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'><rect width='32' height='32' rx='8' fill='%236366f1'/><text x='16' y='22' font-size='15' font-family='sans-serif' fill='white' text-anchor='middle'>AI</text></svg>">
</head>
<body>
<svg width="0" height="0" style="position:absolute" aria-hidden="true">
  <symbol id="i-spark" viewBox="0 0 24 24"><path d="M12 3.4l1.9 5.2 5.2 1.9-5.2 1.9L12 17.6l-1.9-5.2L4.9 10.5l5.2-1.9z"/><path d="M18.6 16.4l.8 2 2 .8-2 .8-.8 2-.8-2-2-.8 2-.8z"/></symbol>
  <symbol id="i-user" viewBox="0 0 24 24"><circle cx="12" cy="8.2" r="3.6"/><path d="M4.8 20c.7-3.8 3.6-6 7.2-6s6.5 2.2 7.2 6"/></symbol>
  <symbol id="i-lock" viewBox="0 0 24 24"><rect x="4.4" y="10.4" width="15.2" height="9.6" rx="2.4"/><path d="M8.2 10.4V7.8a3.8 3.8 0 0 1 7.6 0v2.6"/></symbol>
  <symbol id="i-spark2" viewBox="0 0 24 24"><path d="M12 3v4M12 17v4M3 12h4M17 12h4M6.4 6.4l2.8 2.8M14.8 14.8l2.8 2.8M17.6 6.4l-2.8 2.8M9.2 14.8l-2.8 2.8"/></symbol>
  <symbol id="i-eye" viewBox="0 0 24 24"><path d="M2.6 12S6 5.8 12 5.8 21.4 12 21.4 12 18 18.2 12 18.2 2.6 12 2.6 12z"/><circle cx="12" cy="12" r="3"/></symbol>
  <symbol id="i-eye-off" viewBox="0 0 24 24"><path d="M4 4l16 16"/><path d="M9.6 5.9A9 9 0 0 1 12 5.8c6 0 9.4 6.2 9.4 6.2a17 17 0 0 1-3 3.7"/><path d="M6.5 7.9A17 17 0 0 0 2.6 12S6 18.2 12 18.2a9 9 0 0 0 3.4-.7"/><path d="M9.9 10.1a3 3 0 0 0 4.1 4.2"/></symbol>
</svg>

<div class="auth-bg" aria-hidden="true">
  <div class="auth-bg-tint"></div>
  <div class="slogan-overlay">把找人这件事，交给算法做漏斗。</div>
</div>

<main class="auth-center">
  <div class="auth-card">
    <!-- 品牌（原始横向布局，整体居中） -->
    <div class="brand-row">
      <div class="brand-logo">AI</div>
      <div class="brand-text">
        <b>AI 猎头助手</b>
        <span>Talent Intelligence Platform</span>
      </div>
    </div>

    <!-- 页面标题：登录 / 注册 -->
    <h1 id="formTitle" class="form-title">登录</h1>

    <form id="authForm" autocomplete="on" novalidate>
      <label class="field">
        <span>用户名</span>
        <div class="input-wrap">
          <svg><use href="#i-user"/></svg>
          <input id="username" name="username" type="text" placeholder="3-20 位字母、数字或下划线" autocomplete="username" required>
        </div>
      </label>

      <label class="field" id="nameField" hidden>
        <span>显示名称</span>
        <div class="input-wrap">
          <svg><use href="#i-spark2"/></svg>
          <input id="displayName" name="displayName" type="text" placeholder="例如：张敏（招聘经理）" autocomplete="nickname">
        </div>
      </label>

      <label class="field">
        <span>密码</span>
        <div class="input-wrap">
          <svg><use href="#i-lock"/></svg>
          <input id="password" name="password" type="password" placeholder="至少 6 位" autocomplete="current-password" required>
          <button type="button" class="eye" id="eyeBtn" title="显示密码"><svg><use href="#i-eye"/></svg></button>
        </div>
      </label>

      <label class="field" id="confirmField" hidden>
        <span>确认密码</span>
        <div class="input-wrap">
          <svg><use href="#i-lock"/></svg>
          <input id="password2" name="password2" type="password" placeholder="再输入一次密码" autocomplete="new-password">
          <button type="button" class="eye" id="eyeBtn2" title="显示密码"><svg><use href="#i-eye"/></svg></button>
        </div>
      </label>

      <label class="remember" id="rememberRow">
        <input type="checkbox" id="rememberPwd">
        <span>记住密码</span>
      </label>

      <div class="meter" id="meter" hidden><i></i><i></i><i></i></div>

      <div class="form-note" id="formNote" hidden></div>

      <button class="submit" id="submitBtn" type="submit">
        <span id="submitText">登录</span>
      </button>
    </form>

    <div class="alt-login" id="altLogin">
      <span id="altText">还没账号？<button type="button" class="link" id="switchBtn">立即注册</button></span>
    </div>
  </div>
</main>

<script src="/assets/auth.js?v=9"></script>
</body>
</html>
